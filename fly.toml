app = "cerebro-ai"
primary_region = "gru"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/cerebro.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "cerebro_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpus = 1
